<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Investidor Pro - Gestão</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --primary: #00d1b2; --dark: #121212; --gray: #1e1e1e; --text: #ffffff; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--dark); color: var(--text); margin: 0; }
        
        /* Menu de Abas */
        .tab-menu { display: flex; background: var(--gray); position: sticky; top: 0; z-index: 100; border-bottom: 1px solid #333; }
        .tab-btn { flex: 1; padding: 15px; border: none; background: none; color: #888; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .tab-btn.active { color: var(--primary); border-bottom: 3px solid var(--primary); }

        .container { padding: 20px; max-width: 500px; margin: auto; }
        .content { display: none; }
        .content.active { display: block; }

        .card { background: var(--gray); padding: 20px; border-radius: 15px; margin-bottom: 20px; border: 1px solid #333; }
        .balance-value { font-size: 2rem; font-weight: bold; color: var(--primary); }
        .label-small { font-size: 0.8rem; color: #888; text-transform: uppercase; }

        input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: none; background: #333; color: white; box-sizing: border-box; }
        .btn { width: 100%; background: var(--primary); color: var(--dark); border: none; padding: 15px; border-radius: 10px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        
        .chart-container { height: 250px; width: 100%; margin: 15px 0; }
    </style>
</head>
<body>

    <div class="tab-menu">
        <button class="tab-btn active" onclick="openTab('simulador', this)">SIMULADOR</button>
        <button class="tab-btn" onclick="openTab('aportes', this)">MEUS APORTES</button>
    </div>

    <div class="container">
        
        <div id="simulador" class="content active">
            <div class="card">
                <span class="label-small">Projeção Total</span>
                <div class="balance-value" id="total-final">R$ 0,00</div>
                
                <div style="display: flex; gap: 20px; margin-top: 10px;">
                    <div>
                        <span class="label-small">Só Juros</span>
                        <div id="so-juros" style="color: #00d1b2; font-weight: bold;">R$ 0,00</div>
                    </div>
                    <div>
                        <span class="label-small">Seu Capital</span>
                        <div id="so-capital" style="color: #fff;">R$ 0,00</div>
                    </div>
                </div>

                <div class="chart-container">
                    <canvas id="meuGrafico"></canvas>
                </div>
            </div>

            <div class="card">
                <h3>Ajustar Simulação</h3>
                <label class="label-small">Investimento Inicial</label>
                <input type="number" id="capital-input" value="1000">
                <label class="label-small">Taxa Mensal (%)</label>
                <input type="number" id="taxa-input" value="1.5">
                <button class="btn" onclick="atualizarSimulacao()">Recalcular</button>
            </div>
        </div>

        <div id="aportes" class="content">
            <div class="card">
                <h3>Realizar Novo Aporte</h3>
                <p class="label-small">Envie capital para a sua conta de investimento via PIX.</p>
                <input type="number" id="valor-aporte" placeholder="Valor do Aporte (R$)">
                <button class="btn" onclick="mostrarPix()">Gerar Código PIX</button>
            </div>

            <div id="area-pix" class="card" style="display: none; text-align: center; border: 2px dashed var(--primary);">
                <h3>Pagamento PIX</h3>
                <div style="background: #fff; color: #000; padding: 10px; font-family: monospace; border-radius: 5px; margin: 10px 0;" id="chave">SUA-CHAVE-AQUI</div>
                <button class="btn" style="background: #fff;" onclick="copiarPix()">Copiar Código</button>
            </div>
        </div>

    </div>

    <script>
        let meuGrafico;

        // Lógica das Abas
        function openTab(tabName, btn) {
            let i, content, tabBtns;
            content = document.getElementsByClassName("content");
            for (i = 0; i < content.length; i++) { content[i].classList.remove("active"); }
            
            tabBtns = document.getElementsByClassName("tab-btn");
            for (i = 0; i < tabBtns.length; i++) { tabBtns[i].classList.remove("active"); }
            
            document.getElementById(tabName).classList.add("active");
            btn.classList.add("active");
        }

        function atualizarSimulacao() {
            const C = parseFloat(document.getElementById('capital-input').value) || 0;
            const i = parseFloat(document.getElementById('taxa-input').value) / 100;
            const t = 12;

            let dadosTotal = [];
            let labels = [];
            let capitais = [];

            for (let mes = 0; mes <= t; mes++) {
                let M = C * Math.pow((1 + i), mes);
                dadosTotal.push(M.toFixed(2));
                capitais.push(C.toFixed(2));
                labels.push("Mês " + mes);
            }

            const totalFinal = parseFloat(dadosTotal[t]);
            const jurosGanhos = totalFinal - C;

            document.getElementById('total-final').innerText = totalFinal.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
            document.getElementById('so-juros').innerText = jurosGanhos.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
            document.getElementById('so-capital').innerText = C.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

            renderizarGrafico(labels, dadosTotal, capitais);
        }

        function renderizarGrafico(labels, dados, capitais) {
            const ctx = document.getElementById('meuGrafico').getContext('2d');
            if (meuGrafico) { meuGrafico.destroy(); }
            meuGrafico = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Total Acumulado',
                        data: dados,
                        borderColor: '#00d1b2',
                        backgroundColor: 'rgba(0, 209, 178, 0.1)',
                        fill: true,
                        tension: 0.4
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
            });
        }

        function mostrarPix() {
            const val = document.getElementById('valor-aporte').value;
            if(!val) return alert("Digite um valor");
            document.getElementById('area-pix').style.display = 'block';
        }

        function copiarPix() {
            navigator.clipboard.writeText(document.getElementById('chave').innerText);
            alert("PIX Copiado! Envie o comprovante após o pagamento.");
        }

        window.onload = atualizarSimulacao;
    </script>
</body>
</html>
