<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Investidor Pro - Multi-Cliente</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        :root { --primary: #00d1b2; --dark: #121212; --gray: #1e1e1e; --text: #ffffff; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--dark); color: var(--text); margin: 0; }
        #login-screen { position: fixed; inset: 0; background: var(--dark); z-index: 2000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .tab-menu { display: none; background: var(--gray); position: sticky; top: 0; z-index: 100; border-bottom: 1px solid #333; }
        .tab-btn { flex: 1; padding: 15px; border: none; background: none; color: #888; font-weight: bold; cursor: pointer; font-size: 0.7rem; }
        .tab-btn.active { color: var(--primary); border-bottom: 3px solid var(--primary); }
        .container { padding: 20px; max-width: 550px; margin: auto; }
        .content { display: none; }
        .content.active { display: block; }
        .card { background: var(--gray); padding: 20px; border-radius: 15px; margin-bottom: 20px; border: 1px solid #333; }
        input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: none; background: #333; color: white; box-sizing: border-box; }
        .btn { width: 100%; background: var(--primary); color: var(--dark); border: none; padding: 15px; border-radius: 10px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="card" style="width: 85%; max-width: 350px; text-align: center;">
            <h2 style="color: var(--primary)">Acesso Individual</h2>
            <input type="text" id="user-id" placeholder="Digite seu CPF ou Nome">
            <input type="password" id="pass-input" placeholder="Senha">
            <button class="btn" onclick="fazerLogin()">Entrar</button>
        </div>
    </div>

    <div class="tab-menu" id="main-menu">
        <button class="tab-btn active" onclick="openTab('resumo', this)">RESUMO</button>
        <button class="tab-btn" onclick="openTab('extrato', this)">EXTRATO</button>
        <button class="tab-btn" onclick="openTab('admin', this)" id="btn-tab-admin" style="display:none; color: yellow;">ADMIN 🛠️</button>
    </div>

    <div class="container">
        <div id="resumo" class="content active">
            <div class="card">
                <span id="nome-cliente" style="color: #888; font-size: 0.8rem;">Olá!</span>
                <div style="font-size: 2rem; font-weight: bold; color: var(--primary);" id="saldo-total">R$ 0,00</div>
            </div>
        </div>

        <div id="extrato" class="content">
            <div class="card" id="lista-logs">Carregando dados...</div>
        </div>

        <div id="admin" class="content">
            <div class="card">
                <h3>Gerir Cliente Específico</h3>
                <input type="text" id="adm-cliente-id" placeholder="CPF/Nome do Cliente">
                <input type="number" id="adm-valor" placeholder="Valor R$">
                <button class="btn" onclick="registrarOp('deposito')">Adicionar Aporte</button>
                <button class="btn" style="background: #ff3860; margin-top: 10px;" onclick="registrarOp('saque')">Registrar Retirada</button>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBrkcTuqt4jWLSVz3g96z--8iNe30sAiXg", 
            authDomain: "meuinvestimentoreal-e4aa1.firebaseapp.com",
            databaseURL: "https://meuinvestimentoreal-e4aa1-default-rtdb.firebaseio.com",
            projectId: "meuinvestimentoreal-e4aa1"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        let usuarioLogado = "";

        function fazerLogin() {
            const user = document.getElementById('user-id').value.trim().toLowerCase();
            const pass = document.getElementById('pass-input').value;

            if(user === "admin" && pass === "admin99") {
                usuarioLogado = "admin";
                document.getElementById('btn-tab-admin').style.display = 'block';
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('main-menu').style.display = 'flex';
            } else if(user !== "" && pass === "1234") {
                usuarioLogado = user;
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('main-menu').style.display = 'flex';
                document.getElementById('nome-cliente').innerText = "Cliente: " + user.toUpperCase();
                ouvirDados(user);
            } else {
                alert("Dados incorretos!");
            }
        }

        function registrarOp(tipo) {
            const clienteAlvo = document.getElementById('adm-cliente-id').value.trim().toLowerCase();
            const valor = parseFloat(document.getElementById('adm-valor').value);
            if(!clienteAlvo || !valor) return alert("Preencha todos os campos!");

            db.ref('usuarios/' + clienteAlvo).push({
                data: new Date().toLocaleDateString('pt-BR'),
                tipo: tipo,
                valor: valor,
                timestamp: Date.now()
            }).then(() => {
                alert("Lançado para " + clienteAlvo);
                document.getElementById('adm-valor').value = "";
            });
        }

        function ouvirDados(userId) {
            db.ref('usuarios/' + userId).on('value', (snapshot) => {
                const dados = snapshot.val();
                let saldo = 0;
                let html = "";
                if (dados) {
                    Object.values(dados).sort((a,b) => b.timestamp - a.timestamp).forEach(item => {
                        saldo += (item.tipo === 'deposito' ? item.valor : -item.valor);
                        html += `<div style="display:flex; justify-content:space-between; padding:10px; border-bottom:1px solid #333;">
                                    <span>${item.data}</span>
                                    <span style="color:${item.tipo === 'deposito' ? '#00d1b2':'#ff3860'}">${item.tipo.toUpperCase()}</span>
                                    <span>R$ ${item.valor.toFixed(2)}</span>
                                 </div>`;
                    });
                }
                document.getElementById('saldo-total').innerText = saldo.toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
                document.getElementById('lista-logs').innerHTML = html || "Sem movimentações.";
            });
        }

        function openTab(tabName, btn) {
            let content = document.getElementsByClassName("content");
            for (let i = 0; i < content.length; i++) { content[i].classList.remove("active"); }
            let tabBtns = document.getElementsByClassName("tab-btn");
            for (let i = 0; i < tabBtns.length; i++) { tabBtns[i].classList.remove("active"); }
            document.getElementById(tabName).classList.add("active");
            btn.classList.add("active");
        }
    </script>
</body>
</html>
