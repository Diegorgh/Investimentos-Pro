<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invest Pro - Cronograma Real</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        :root { --primary: #00d1b2; --dark: #121212; --gray: #1e1e1e; --text: #ffffff; --red: #ff3860; --gold: #f1c40f; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--dark); color: var(--text); margin: 0; }
        #login-screen { position: fixed; inset: 0; background: var(--dark); z-index: 2000; display: flex; align-items: center; justify-content: center; }
        .tab-menu { display: none; background: var(--gray); position: sticky; top: 0; z-index: 100; border-bottom: 1px solid #333; overflow-x: auto; }
        .tab-btn { flex: 1; padding: 15px 10px; border: none; background: none; color: #888; font-weight: bold; cursor: pointer; font-size: 0.65rem; white-space: nowrap; }
        .tab-btn.active { color: var(--primary); border-bottom: 3px solid var(--primary); }
        .container { padding: 20px; max-width: 550px; margin: auto; padding-bottom: 100px; }
        .content { display: none; }
        .content.active { display: block; }
        .card { background: var(--gray); padding: 20px; border-radius: 15px; margin-bottom: 20px; border: 1px solid #333; }
        .balance-value { font-size: 2.2rem; font-weight: bold; color: var(--primary); margin: 10px 0; }
        .label-small { font-size: 0.75rem; color: #888; text-transform: uppercase; letter-spacing: 1px; }
        table { width: 100%; border-collapse: collapse; font-size: 0.8rem; margin-top: 10px; color: #fff; }
        th { text-align: left; color: var(--primary); padding: 10px; border-bottom: 1px solid #333; }
        td { padding: 10px; border-bottom: 1px solid #222; }
        .mes-atual { background: rgba(0, 209, 178, 0.1); border-left: 4px solid var(--primary); }
        input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: none; background: #333; color: white; box-sizing: border-box; }
        .btn { width: 100%; background: var(--primary); color: var(--dark); border: none; padding: 14px; border-radius: 10px; font-weight: bold; cursor: pointer; margin-top: 8px; }
        .client-item { background: #2d2d2d; padding: 10px; border-radius: 8px; margin-bottom: 5px; cursor: pointer; border-left: 4px solid var(--primary); }
        .btn-whatsapp { position: fixed; bottom: 20px; right: 20px; background-color: #25d366; color: white; padding: 12px 18px; border-radius: 50px; text-decoration: none; font-weight: bold; z-index: 1000; font-size: 0.8rem; }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="card" style="width: 85%; max-width: 350px; text-align: center;">
            <h2 style="color: var(--primary)">Invest Pro</h2>
            <input type="text" id="user-id" placeholder="ID de Acesso">
            <input type="password" id="pass-input" placeholder="Senha">
            <button class="btn" onclick="fazerLogin()">Aceder</button>
        </div>
    </div>

    <div class="tab-menu" id="main-menu">
        <button class="tab-btn active" onclick="openTab('resumo', this)">RESUMO</button>
        <button class="tab-btn" onclick="openTab('evolucao', this)">CRONOGRAMA</button>
        <button class="tab-btn" onclick="openTab('extrato', this)">EXTRATO</button>
        <button class="tab-btn" onclick="openTab('admin', this)" id="btn-tab-admin" style="display:none; color: var(--gold);">ADMIN 🛠️</button>
    </div>

    <a href="https://wa.me/5581989006674" class="btn-whatsapp" target="_blank">💬 WhatsApp</a>

    <div class="container">
        
        <div id="resumo" class="content active">
            <div class="card">
                <span class="label-small" id="welcome-msg">Saldo Total</span>
                <div class="balance-value" id="saldo-total">R$ 0,00</div>
                <div id="taxa-atual-view" style="font-size: 0.8rem; color: #888;">Taxa: 1.5% a.m</div>
            </div>
        </div>

        <div id="evolucao" class="content">
            <div class="card">
                <h3>Evolução Mensal</h3>
                <p class="label-small">Projeção por Calendário</p>
                <table>
                    <thead><tr><th>Mês</th><th>Rendimento</th><th>Saldo Final</th></tr></thead>
                    <tbody id="tabela-evolucao"></tbody>
                </table>
            </div>
        </div>

        <div id="extrato" class="content">
            <div class="card"><h3>Histórico Real</h3><div id="lista-logs">Sem dados.</div></div>
        </div>

        <div id="admin" class="content">
            <div class="card">
                <h3>Painel Administrativo</h3>
                <input type="text" id="adm-cliente-id" placeholder="Cliente Selecionado">
                <div id="view-admin-client" style="display:none; margin-bottom: 20px; padding: 10px; border: 1px solid var(--gold); border-radius: 8px;">
                    <div id="adm-info-saldo" style="font-size: 1.2rem; font-weight: bold; color: var(--gold);">R$ 0,00</div>
                    <input type="number" id="adm-taxa-input" step="0.1" placeholder="Taxa %">
                    <button class="btn" style="background:var(--gold); color:black;" onclick="salvarTaxaAdmin()">Atualizar Taxa</button>
                </div>
                <input type="number" id="adm-valor" placeholder="Valor Operação R$">
                <button class="btn" onclick="registrarOp('deposito')">Depositar</button>
                <button class="btn" style="background:var(--red); color:white;" onclick="registrarOp('saque')">Sacar</button>
            </div>
            <div class="card">
                <h4>Clientes:</h4>
                <div id="corpo-lista-clientes"></div>
            </div>
        </div>

    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBrkcTuqt4jWLSVz3g96z--8iNe30sAiXg", 
            authDomain: "meuinvestimentoreal-e4aa1.firebaseapp.com",
            databaseURL: "https://meuinvestimentoreal-e4aa1-default-rtdb.firebaseio.com",
            projectId: "meuinvestimentoreal-e4aa1"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const nomesMeses = ["Jan", "Fev", "Mar", "Abr", "Mai", "Jun", "Jul", "Ago", "Set", "Out", "Nov", "Dez"];

        function fazerLogin() {
            const u = document.getElementById('user-id').value.trim().toLowerCase();
            const p = document.getElementById('pass-input').value;
            if(u === "admin" && p === "admin99") {
                document.getElementById('btn-tab-admin').style.display = 'block';
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('main-menu').style.display = 'flex';
                ouvirListaClientes();
            } else if(u !== "" && p === "1234") {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('main-menu').style.display = 'flex';
                ouvirDadosCliente(u);
            } else { alert("Erro!"); }
        }

        function ouvirDadosCliente(id) {
            db.ref('configs/'+id).on('value', sConf => {
                let taxa = sConf.val() ? sConf.val().taxa : 0.015;
                document.getElementById('taxa-atual-view').innerText = `Taxa: ${(taxa*100).toFixed(1)}% a.m`;
                
                db.ref('usuarios/'+id).on('value', sData => {
                    let saldo = 0; let logs = "";
                    if(sData.val()) {
                        Object.values(sData.val()).sort((a,b)=>b.timestamp-a.timestamp).forEach(i => {
                            saldo += (i.tipo==='deposito'?i.valor:-i.valor);
                            logs += `<div style="display:flex; justify-content:space-between; padding:8px; border-bottom:1px solid #333; font-size:0.8rem">
                                <span>${i.data}</span><span style="color:${i.tipo==='deposito'?'#00d1b2':'#ff3860'}">${i.tipo}</span><span>R$ ${i.valor.toFixed(2)}</span></div>`;
                        });
                    }
                    document.getElementById('saldo-total').innerText = saldo.toLocaleString('pt-BR', {style:'currency',currency:'BRL'});
                    document.getElementById('lista-logs').innerHTML = logs || "Sem dados";
                    
                    // GERAR CRONOGRAMA POR MESES REAIS
                    let tab = "";
                    let dataAtual = new Date();
                    let mesInicial = dataAtual.getMonth();
                    let anoInicial = dataAtual.getFullYear();
                    let tempSaldo = saldo;

                    for(let m=0; m<12; m++) {
                        let indiceMes = (mesInicial + m) % 12;
                        let ano = anoInicial + Math.floor((mesInicial + m) / 12);
                        let juros = tempSaldo * taxa;
                        let classeDestaque = (m === 0) ? "class='mes-atual'" : "";
                        let labelMes = (m === 0) ? "ATUAL" : "";
                        
                        tempSaldo += juros;

                        tab += `<tr ${classeDestaque}>
                            <td>${nomesMeses[indiceMes]}/${ano} ${labelMes}</td>
                            <td style="color:#00d1b2">+ R$ ${juros.toFixed(2)}</td>
                            <td>R$ ${tempSaldo.toFixed(2)}</td>
                        </tr>`;
                    }
                    document.getElementById('tabela-evolucao').innerHTML = tab;
                });
            });
        }

        function selecionarClienteAdmin(id) {
            document.getElementById('adm-cliente-id').value = id;
            document.getElementById('view-admin-client').style.display = 'block';
            db.ref('configs/'+id).once('value', s => {
                let t = s.val() ? s.val().taxa : 0.015;
                document.getElementById('adm-taxa-input').value = (t*100).toFixed(1);
                db.ref('usuarios/'+id).on('value', snap => {
                    let sld = 0; if(snap.val()){ Object.values(snap.val()).forEach(i => sld += (i.tipo==='deposito'?i.valor:-i.valor)); }
                    document.getElementById('adm-info-saldo').innerText = "Saldo: " + sld.toLocaleString('pt-BR', {style:'currency',currency:'BRL'});
                });
            });
        }

        function salvarTaxaAdmin() {
            let id = document.getElementById('adm-cliente-id').value.trim().toLowerCase();
            let tx = parseFloat(document.getElementById('adm-taxa-input').value) / 100;
            if(id && !isNaN(tx)) db.ref('configs/'+id).set({taxa: tx}).then(()=>alert("Taxa Atualizada!"));
        }

        function registrarOp(tipo) {
            let id = document.getElementById('adm-cliente-id').value.trim().toLowerCase();
            let v = parseFloat(document.getElementById('adm-valor').value);
            if(id && v) db.ref('usuarios/'+id).push({data: new Date().toLocaleDateString('pt-BR'), tipo: tipo, valor: v, timestamp: Date.now()}).then(()=>alert("Sucesso!"));
        }

        function ouvirListaClientes() {
            db.ref('usuarios').on('value', s => {
                let h = ""; if(s.val()) Object.keys(s.val()).forEach(u => h += `<div class="client-item" onclick="selecionarClienteAdmin('${u}')">👤 ${u.toUpperCase()}</div>`);
                document.getElementById('corpo-lista-clientes').innerHTML = h || "Nenhum cliente";
            });
        }

        function openTab(t, b) {
            let c = document.getElementsByClassName("content"); for(let i=0;i<c.length;i++) c[i].classList.remove("active");
            let bt = document.getElementsByClassName("tab-btn"); for(let i=0;i<bt.length;i++) bt[i].classList.remove("active");
            document.getElementById(t).classList.add("active"); b.classList.add("active");
        }
    </script>
</body>
</html>
